<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Panel Mobile</title><style>*{box-sizing:border-box;font-family:Segoe UI,Arial}body{margin:0;background:#f4f6f9}.mobile-header{position:sticky;top:0;background:#8c2332;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}.app-title{font-size:22px;font-weight:700}.main{padding:12px}.search input{width:100%;padding:12px;border-radius:20px;border:2px solid #003366}.section{background:#fff;margin:12px 0;padding:15px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{background:#0078d4;color:#fff;border:none;border-radius:10px;padding:14px;font-weight:bold;cursor:pointer}.footer{background:#003366;color:#fff;text-align:center;padding:12px;border-radius:12px}.dark{background:#1b1b1b;color:#fff}.dark .section{background:#2a2a2a}.dark input,.dark select{background:#333;color:#fff}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div class="mobile-header"><div><div class="app-title">MY PANEL</div><div>ONGC Quick Access</div></div><button onclick="document.body.classList.toggle('dark')">🌙</button></div><div class="main"><div id="dt"></div><div class="search"><input id="s" placeholder="Search portal..." onkeyup="f()"></div><div class="section"><h3>Internet Network</h3><div class="grid"><button class="btn" onclick="o('https://outlook.cloud.microsoft/mail/')">ONGC Mail</button><button class="btn" onclick="o('https://copilot.cloud.microsoft/chat')">Copilot</button><button class="btn" onclick="o('https://webice.ongc.co.in/irj/portal')">WebICE</button><button class="btn" onclick="o('https://mmportal.ongc.co.in/login')">MM Portal</button><button class="btn" onclick="o('https://gem.gov.in/view_contracts')">GEM Portal</button><button class="btn" onclick="o('https://cra.nps-proteantech.in/CRA/')">NPS Login</button><button class="btn" onclick="o('https://mis.epfindia.gov.in/PensionPaymentEnquiry/pensionStatus.jsp')">EPFO</button><button class="btn" onclick="o('https://jeevanpramaan.gov.in/v2.0/')">Jeevan Pramaan</button></div></div><div class="section"><h3>Intranet Network</h3><div class="grid"><button class="btn" onclick="o('http://10.205.122.39/mr/')">ONGC Intranet</button><button class="btn" onclick="o('https://upasti.ongc.co.in/auth/login/?next=/')">Upasti</button></div></div><div class="section"><h3 onclick="toggleShopping()" style="cursor:pointer;">🛒 Shopping ▼</h3><div id="shoppingMenu" style="display:none;"><select onchange="if(this.value) o(this.value)" style="width:100%;padding:12px;border-radius:10px;border:2px solid #003366;"><option value="">🛍️ Select Shopping Site</option><option value="https://www.amazon.in">📦 Amazon India</option><option value="https://www.dmart.in">🏪 Dmart</option><option value="https://www.bigbasket.com">🥬 BigBasket</option></select></div></div><div class="section"><h3 onclick="toggleBill()" style="cursor:pointer;">💳 Bill Payment ▼</h3><div id="billMenu" style="display:none;"><select onchange="if(this.value) o(this.value)" style="width:100%;padding:12px;border-radius:10px;border:2px solid #003366;"><option value="">Select Service</option><option value="https://wss.mahadiscom.in/wss/wss?uiActionName=getCustAccountLogin">⚡ MSEB Login</option><option value="https://www.cesc.co.in/customerLogin">⚡ CESC Login</option><option value="https://portal.bsnl.in/myportal/authorize.do">☎️ BSNL Kolkata</option><option value="https://billcare.mtnl.net.in/">☎️ MTNL Mumbai</option><option value="https://www.mahanagargas.com/Billing/customer-login.aspx">🔥 Mahanagar Gas Ltd</option><option value="https://access.ex.indianoil.in/oam/server/obrareq.cgi?encquery%3DBS4YDMyhNDM0iECd28ECVk4yM7G7jM71oQ0Cx%2BNw1jS1TIsqlG0tMEo6s6qntB%2BUB4Y7SNagRDIYAgZBIuTBLE6tAUsCst%2BjEnks1EoelnFyPS1lp131XggGBg8jkFtJAGIPHroZidJoDBjEl%2F2Tuv0h98d03yBAmJNB%2BG2G3iR60YpXRuqZwhiN4yMN9tTd%2BHh0Z3drNMdWiw0BKdkjMi1vXI7N5fC1neKHpIYBIgqybz4sQhdI3nrntOnZXs241WxPra9pP4AAwvZlinB13r%2BRUDKGQAdmuJUCfVJtxvwL2zlUOJTKOKfnZVMBbRiCToxTPJl7GH4hmyBtTS4aqQ%3D%3D">⛽ Indane Gas</option><option value="https://ebiz.licindia.in/D2CPM/#Login">🛡️ LIC</option></select></div></div><div class="section"><h3>Calendar</h3><input type="date" style="width:100%;padding:10px"></div><div class="footer">My Panel Mobile</div></div><script>function o(u){window.open(u,'_blank','noopener,noreferrer')}function f(){let v=document.getElementById('s').value.toLowerCase();document.querySelectorAll('.btn').forEach(b=>b.style.display=b.innerText.toLowerCase().includes(v)?'':'none')}function toggleShopping(){const m=document.getElementById('shoppingMenu');m.style.display=(m.style.display==='block')?'none':'block';}function toggleBill(){const m=document.getElementById('billMenu');m.style.display=(m.style.display==='block')?'none':'block';}setInterval(()=>document.getElementById('dt').innerHTML=new Date().toLocaleString('en-IN'),1000)</script></body></html>
